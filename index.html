<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Attributes</title>
  </head>
  <body>
    <!-- Navigating to internal documents -->
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <!-- common attributes: title, width, height, dir, id -->
    <h1 title="this is a title" dir="rtl">HTML Attributes</h1>
    <!-- Navigating to external document -->
    <a href="https://shorturl.at/X82uG">
      <img
        id="bot"
        src="think-bot.jpeg"
        alt="AI Bot thinking"
        title="AI Bot"
        width="200px"
        height="100px"
    /></a>

  </body>
</html>
